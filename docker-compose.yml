# Full production-like stack: API + Qdrant (vectors) + Postgres (knowledge graph) + Valkey (cache/rate limit).
#   make dev-key && docker compose up --build -d && make demo-remote
name: sentinel-rag

x-healthcheck: &hc
  interval: 5s
  timeout: 3s
  retries: 20

services:
  api:
    build: .
    image: sentinel-rag:local
    ports: ["8000:8000"]
    env_file: .env
    environment:
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      GRAPH_BACKEND: postgres
      POSTGRES_DSN: postgresql://sentinel:${POSTGRES_PASSWORD:?run make dev-key first}@postgres:5432/sentinel
      CACHE_BACKEND: redis
      REDIS_URL: redis://valkey:6379/0
      ENVIRONMENT: dev
    depends_on:
      qdrant: { condition: service_healthy }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_DB: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make dev-key first}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      <<: *hc
      test: ["CMD", "valkey-cli", "ping"]

volumes:
  qdrant-data:
  pg-data:
