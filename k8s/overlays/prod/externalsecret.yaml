# Requires External Secrets Operator + a ClusterSecretStore named "vault-backend".
# No secret material lives in Git; ESO syncs it into the sentinel-rag-secrets Secret and refreshes hourly.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sentinel-rag-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: vault-backend }
  target:
    name: sentinel-rag-secrets
    creationPolicy: Owner
  data:
    - { secretKey: POSTGRES_DSN,     remoteRef: { key: sentinel-rag/prod, property: postgres_dsn } }
    - { secretKey: REDIS_URL,        remoteRef: { key: sentinel-rag/prod, property: redis_url } }
    - { secretKey: QDRANT_API_KEY,   remoteRef: { key: sentinel-rag/prod, property: qdrant_api_key } }
    - { secretKey: LLM_API_KEY,      remoteRef: { key: sentinel-rag/prod, property: llm_api_key } }
    - { secretKey: API_KEYS_SHA256,  remoteRef: { key: sentinel-rag/prod, property: api_keys_sha256 } }
