apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-rag
  labels: { app.kubernetes.io/name: sentinel-rag, app.kubernetes.io/component: api }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: sentinel-rag, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sentinel-rag, app.kubernetes.io/component: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sentinel-rag
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: sentinel-rag, app.kubernetes.io/component: api }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: sentinel-rag, app.kubernetes.io/component: api }
      containers:
        - name: api
          image: sentinel-rag
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000, protocol: TCP }
          envFrom:
            - configMapRef: { name: sentinel-rag-config }
            - secretRef: { name: sentinel-rag-secrets }   # POSTGRES_DSN, REDIS_URL, API_KEYS_SHA256, LLM_API_KEY
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }                      # no CPU limit: avoids CFS throttling on latency paths
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:   # let the load balancer deregister the pod before SIGTERM
              exec: { command: ["sleep", "10"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
