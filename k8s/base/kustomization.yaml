apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sentinel-rag
labels:
  - pairs:
      app.kubernetes.io/part-of: sentinel-rag
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml
# Image name/tag/digest is set per overlay (dev: local build, prod: CI-pinned digest).
